# 채권압류 및 추심명령 신청 단계별 슬라이드 캡션
# file: assets/garnishment/ 안의 파일명과 매칭

- file: 01.webp
  step: "표지"
  title: "채권압류 및 추심명령 청구前 준비사항"
  desc: "① 지급명령 정본(발급번호 5자리) ② 채권자 법인등기사항 전부증명서(PDF) ③ 제3채무자(은행) 법인등기사항 전부증명서 은행별 1부(PDF) ④ 송달증명원(민사로 진행했을 경우)"

- file: 02.webp
  step: "1"
  title: "전자소송포털 접속"
  desc: "서류제출 화면에서 상단 탭 중 \"민사집행 서류\"를 선택합니다."

- file: 03.webp
  step: "2"
  title: "채권압류 및 추심명령 신청서 선택"
  desc: "민사집행서류 탭 → 채권압류 등 → \"채권압류 및 추심명령 신…\" 서류를 선택합니다."

- file: 04.webp
  step: "3"
  title: "전자소송 동의 · 당사자작성"
  desc: "전자소송시스템 이용에 동의 체크 후 \"당사자작성\"을 누릅니다."

- file: 05.webp
  step: "4"
  title: "사건기본정보 입력"
  desc: "사건명, 청구금액, 청구내용(원금·이자·집행비용), 집행권원 등 표시, 제출법원을 입력합니다. 제출법원은 \"관할법원찾기\"로 확인 후 선택하세요."

- file: 06.webp
  step: "5"
  title: "채권자 기본정보 등록"
  desc: "당사자 구분에서 \"채권자\"를 선택하고 \"내정보가져오기\"로 회원정보를 불러와 등록합니다."

- file: 07.webp
  step: "6"
  title: "채무자 기본정보 입력"
  desc: "당사자 구분에서 \"채무자\"를 선택하고 사업자등록번호·당사자명·대표자·주소 등을 입력해 등록합니다."

- file: 08.webp
  step: "7"
  title: "제3채무자(금융기관) 다수 등록"
  desc: "제3채무자가 여러 금융기관인 경우 \"다수당사자 파일등록\"으로 양식을 다운받아 작성한 엑셀 파일을 업로드해 한 번에 등록합니다."

- file: 09.webp
  step: "8"
  title: "집행권원 정보 등록"
  desc: "당사자 선택 후 집행권원 성격구분(지급명령), 사건번호를 입력해 \"집행권원번호 조회\"를 누릅니다. 집행권원 발급번호(5자리)는 지급명령 정본 하단에서 확인합니다."

- file: 10.webp
  step: "9"
  title: "신청취지 및 이유 작성"
  desc: "신청취지는 그대로 두고, 신청이유에 채권자·채무자·집행권원 내용을 기재합니다."

- file: 11.webp
  step: "10"
  title: "채권/기타 목적물 별지 첨부"
  desc: "작성해 둔 목적물 별지 파일을 \"목적물별지 첨부하기\"로 업로드합니다."

- file: 12.webp
  step: "11"
  title: "진술최고신청서 작성 및 첨부서류 등록"
  desc: "진술최고신청서(제3채무자에 대한)를 작성 후 첨부하고, 지급명령 정본·법인등기사항 전부증명서(채권자·제3채무자)·송달증명서 등을 함께 첨부합니다."

- file: 13.webp
  step: "12"
  title: "첨부서류 목록 확인 · 작성완료"
  desc: "첨부서류 목록을 확인한 뒤 \"등록\" → \"작성완료\"를 누릅니다."

- file: 14.webp
  step: "13"
  title: "문서 내용 확인"
  desc: "자동 생성된 PDF 문서 내용을 확인하고 \"모든 문서의 내용에 이상이 없음을 확인합니다\"에 체크 후 \"확인완료\"를 누릅니다."

- file: 15.webp
  step: "14"
  title: "소송비용 납부 – 납부인 선택"
  desc: "인지액·송달료·법원보관금 납부 당사자와 납부인을 확인하고 \"확인\"을 누릅니다."

- file: 16.webp
  step: "15"
  title: "법원보관금(진술최고비용) 입력"
  desc: "법원보관금 = 채무자 수 × 제3채무자(금융회사) 수 × 2,000원. 납부당사자·납부자·환급계좌를 입력합니다."

- file: 17.webp
  step: "16"
  title: "집행비용 확인 후 소송비용 납부"
  desc: "필요 시 \"이전으로 가기\"에서 집행비용(합계)을 수정한 뒤 작성완료 → 확인완료 → 납부인 선택 → \"소송비용납부\"로 최종 납부합니다."
